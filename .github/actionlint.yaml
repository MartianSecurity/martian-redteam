# job.workflow_sha (the commit of the workflow file that defines the job) was
# added to the job context on github.com in September 2026. actionlint 1.7.12
# predates it and reports the property as undefined. Remove this entry once
# actionlint knows the property.
paths:
  .github/workflows/red-team.yml:
    ignore:
      - 'property "workflow_sha" is not defined in object type'
