# Reusable workflow for customer repositories (workflow_call).
# Also runnable via workflow_dispatch on this repo; a missing MARTIAN_API_KEY
# fails closed (ClientError / exit 1). Not used on pull_request here.
# Callers should pin this workflow to a tag or SHA instead of @main. The SDK
# is installed at the same commit as this file unless sdk-ref says otherwise.
# See docs/gate-and-ci.md.
name: Martian Red Team

on:
  workflow_call:
    inputs:
      config:
        description: Path to the YAML assessment config in the caller repository
        type: string
        required: false
        default: examples/config.yaml
      output:
        description: Directory for risk-assessment.json and related artifacts
        type: string
        required: false
        default: results
      python-version:
        description: Python version for setup-uv (package requires >=3.12)
        type: string
        required: false
        default: "3.12"
      timeout-minutes:
        description: Job timeout in minutes
        type: number
        required: false
        default: 30
      sdk-ref:
        description: >
          Git ref of MorningHQ/martian-redteam to install. Empty (default)
          installs the commit this workflow file was called at
          (job.workflow_sha), so pinning the workflow to a tag or SHA pins the
          SDK too. Only letters, digits, ".", "_", "/" and "-" are accepted.
        type: string
        required: false
        default: ""
      max-concurrent:
        description: Override system_config.max_concurrent (CLI -c). Empty uses YAML.
        type: string
        required: false
        default: ""
      attacks-per-vuln:
        description: Override system_config.attacks_per_vulnerability_type (CLI -a). Empty uses YAML.
        type: string
        required: false
        default: ""
    secrets:
      MARTIAN_API_KEY:
        description: Martian Agents API key sent as X-API-Key
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-team:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes || 30 }}
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.0"
          python-version: ${{ inputs.python-version || '3.12' }}

      # Expressions are substituted into the script text before bash parses
      # it, so quoting cannot contain them. Every input reaches the scripts
      # below through env and is referenced as a quoted shell variable.
      - name: Install martian-redteam
        env:
          MARTIAN_REDTEAM_SDK_REF: ${{ inputs.sdk-ref || job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$MARTIAN_REDTEAM_SDK_REF" ]]; then
            echo "::error::sdk-ref is empty and job.workflow_sha is not available on this runner; pass sdk-ref (tag or commit SHA)"
            exit 1
          fi
          if [[ ! "$MARTIAN_REDTEAM_SDK_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::sdk-ref may only contain letters, digits, '.', '_', '/' and '-'"
            exit 1
          fi
          echo "Installing martian-redteam at ${MARTIAN_REDTEAM_SDK_REF}"
          # A throwaway venv, not --system: Ubuntu 24.04's interpreter is PEP 668
          # externally managed and uv refuses to install into it.
          uv venv "${RUNNER_TEMP}/martian-redteam"
          uv pip install --python "${RUNNER_TEMP}/martian-redteam" \
            "martian-redteam @ git+https://github.com/MorningHQ/martian-redteam@${MARTIAN_REDTEAM_SDK_REF}"
          echo "${RUNNER_TEMP}/martian-redteam/bin" >> "${GITHUB_PATH}"

      - name: Run assessment
        env:
          MARTIAN_API_KEY: ${{ secrets.MARTIAN_API_KEY }}
          MARTIAN_API_URL: ${{ vars.MARTIAN_API_URL }}
          MARTIAN_REDTEAM_CONFIG: ${{ inputs.config || 'examples/config.yaml' }}
          MARTIAN_REDTEAM_OUTPUT: ${{ inputs.output || 'results' }}
          MARTIAN_REDTEAM_MAX_CONCURRENT: ${{ inputs.max-concurrent }}
          MARTIAN_REDTEAM_ATTACKS_PER_VULN: ${{ inputs.attacks-per-vuln }}
        run: |
          extra=()
          if [ -n "$MARTIAN_REDTEAM_MAX_CONCURRENT" ]; then
            extra+=(-c "$MARTIAN_REDTEAM_MAX_CONCURRENT")
          fi
          if [ -n "$MARTIAN_REDTEAM_ATTACKS_PER_VULN" ]; then
            extra+=(-a "$MARTIAN_REDTEAM_ATTACKS_PER_VULN")
          fi
          martian-redteam run "$MARTIAN_REDTEAM_CONFIG" -o "$MARTIAN_REDTEAM_OUTPUT" "${extra[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: red-team-results
          path: ${{ inputs.output || 'results' }}
          if-no-files-found: ignore
