name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: martian-redteam-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --extra evals

      - name: Check formatting
        run: uv run --extra evals ruff format --check src tests examples scripts

      - name: Lint Python
        run: uv run --extra evals ruff check src tests examples scripts

  types:
    name: Types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --extra evals

      - name: Type-check Python
        run: uv run --extra mcp --extra evals mypy src

      - name: Compile source
        run: uv run --extra evals python -m compileall -q src

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.0"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --extra evals

      - name: Run Python tests
        run: >
          uv run --extra evals pytest -q
          --cov=martian_redteam --cov=martian
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=junit.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: error

  evals-core:
    name: Evals core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # The in-process MLflow store and the record store run their contracts on Postgres too.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: martian
          POSTGRES_PASSWORD: martian_ci
          POSTGRES_DB: evals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U martian -d evals"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --extra postgres

      - name: Test the evals core without the backend
        env:
          MARTIAN_TEST_POSTGRES_URL: postgresql+psycopg://martian:martian_ci@127.0.0.1:5432/evals
        run: >
          uv run --extra postgres pytest -q tests/evals/test_server.py tests/evals/test_store.py
          tests/evals/test_store_mlflow.py tests/evals/test_records.py tests/evals/test_model.py
          tests/evals/test_mlflow_private.py tests/evals/test_entitlements.py tests/evals/test_bootstrap.py
          tests/evals/test_local.py tests/evals/test_read_routes.py tests/evals/test_read_contract.py tests/evals/test_write_routes.py
          tests/evals/test_write_contract.py tests/evals/test_worker.py tests/evals/test_worker_process.py

  mlflow-compat:
    name: MLflow compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: martian
          POSTGRES_PASSWORD: martian_ci
          POSTGRES_DB: evals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U martian -d evals"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MARTIAN_TEST_POSTGRES_URL: postgresql+psycopg://martian:martian_ci@127.0.0.1:5432/evals
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Suite on the pinned MLflow
        run: python3 scripts/mlflow_compat.py pinned --upgrade-store "$RUNNER_TEMP/mlflow-upgrade"

      # Early warning for the next upgrade: reported, but a new MLflow release cannot fail CI.
      - name: Suite on the newest MLflow release
        continue-on-error: true
        run: python3 scripts/mlflow_compat.py next --upgrade-store "$RUNNER_TEMP/mlflow-upgrade"

  packaging:
    name: Packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build wheel and validate example config
        run: |
          set -euo pipefail
          uv sync --locked --all-extras
          uv build
          uv run --all-extras twine check --strict dist/*
          uv run --all-extras python scripts/check_release.py --install
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one wheel, found ${#wheels[@]}" >&2
            ls -la dist || true
            exit 1
          fi
          uv venv .ci-wheel
          uv pip install --python .ci-wheel "${wheels[0]}[evals]"
          .ci-wheel/bin/martian --version
          .ci-wheel/bin/martian redteam validate examples/config.yaml
          .ci-wheel/bin/python -c "from martian.evals import load_dataset; from martian.redteam import red_team; from martian.evals.server import create_app; from martian.evals.store import MemoryStore"
          .ci-wheel/bin/martian-redteam --version
          .ci-wheel/bin/martian-redteam catalog
          .ci-wheel/bin/martian-redteam validate examples/config.yaml

  action-smoke:
    name: Action smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The evals action comments on this repository's pull requests; nothing else is written.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate via composite action
        uses: ./.github/actions/validate
        with:
          config: examples/config.yaml

      # The two sample suites need no secret: each keeps its own comment on the pull request.
      - name: Evals action on the passing sample
        uses: ./.github/actions/evals
        with:
          suite: examples/github-action/passing/evals.yaml
          output: results/evals-passing

      - name: Evals action on the failing sample
        id: failing-sample
        continue-on-error: true
        uses: ./.github/actions/evals
        with:
          suite: examples/github-action/failing/evals.yaml
          output: results/evals-failing

      - name: Require the failing sample to fail its step on its failed cases
        env:
          FAILING_SAMPLE_OUTCOME: ${{ steps.failing-sample.outcome }}
        run: |
          set -euo pipefail
          if [ "$FAILING_SAMPLE_OUTCOME" != "failure" ]; then
            echo "the failing sample suite did not fail the evals action (outcome: ${FAILING_SAMPLE_OUTCOME})" >&2
            exit 1
          fi
          jq -e '.failed == 2 and .errors == 0' results/evals-failing/summary.json

  ci:
    name: CI
    if: always()
    needs: [lint, types, test, evals-core, mlflow-compat, packaging, action-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        run: |
          lint_result="${{ needs.lint.result }}"
          types_result="${{ needs.types.result }}"
          test_result="${{ needs.test.result }}"
          evals_core_result="${{ needs.evals-core.result }}"
          mlflow_compat_result="${{ needs.mlflow-compat.result }}"
          packaging_result="${{ needs.packaging.result }}"
          action_smoke_result="${{ needs.action-smoke.result }}"
          echo "lint=${lint_result} types=${types_result} test=${test_result} evals-core=${evals_core_result} mlflow-compat=${mlflow_compat_result} packaging=${packaging_result} action-smoke=${action_smoke_result}"
          if [ "$lint_result" != "success" ] || [ "$types_result" != "success" ] || [ "$test_result" != "success" ] || [ "$evals_core_result" != "success" ] || [ "$mlflow_compat_result" != "success" ] || [ "$packaging_result" != "success" ] || [ "$action_smoke_result" != "success" ]; then
            echo "One or more required jobs failed" >&2
            exit 1
          fi
