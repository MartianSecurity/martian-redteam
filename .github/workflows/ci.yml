name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: martian-redteam-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check src tests examples

      - name: Lint Python
        run: uv run ruff check src tests examples

  types:
    name: Types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Type-check Python
        run: uv run --extra mcp mypy src

      - name: Compile source
        run: uv run python -m compileall -q src

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.0"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Run Python tests
        run: >
          uv run pytest -q
          --cov=martian_redteam
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=junit.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: error

  packaging:
    name: Packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build wheel and validate example config
        run: |
          set -euo pipefail
          uv build
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one wheel, found ${#wheels[@]}" >&2
            ls -la dist || true
            exit 1
          fi
          uv venv .ci-wheel
          uv pip install --python .ci-wheel "${wheels[0]}"
          .ci-wheel/bin/martian-redteam --version
          .ci-wheel/bin/martian-redteam catalog
          .ci-wheel/bin/martian-redteam validate examples/config.yaml

  action-smoke:
    name: Action smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate via composite action
        uses: ./.github/actions/validate
        with:
          config: examples/config.yaml

  ci:
    name: CI
    if: always()
    needs: [lint, types, test, packaging, action-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        run: |
          lint_result="${{ needs.lint.result }}"
          types_result="${{ needs.types.result }}"
          test_result="${{ needs.test.result }}"
          packaging_result="${{ needs.packaging.result }}"
          action_smoke_result="${{ needs.action-smoke.result }}"
          echo "lint=${lint_result} types=${types_result} test=${test_result} packaging=${packaging_result} action-smoke=${action_smoke_result}"
          if [ "$lint_result" != "success" ] || [ "$types_result" != "success" ] || [ "$test_result" != "success" ] || [ "$packaging_result" != "success" ] || [ "$action_smoke_result" != "success" ]; then
            echo "One or more required jobs failed" >&2
            exit 1
          fi
