apiVersion: v1
kind: Namespace
metadata:
  name: martian-model-lab
---
apiVersion: batch/v1
kind: Job
metadata:
  name: compact-model-gpu-benchmark-v4
  namespace: martian-model-lab
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: benchmark
          image: martian-model-lab:upgrade-20261017-cuda-v4
          imagePullPolicy: Never
          args: ["--device", "cuda", "--precision", "fp32", "--tokens", "256", "512", "1024", "--iterations", "30", "--threads", "2", "--fit-steps", "5", "--fit-mode", "full", "--checkpointing"]
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
