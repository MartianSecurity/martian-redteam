apiVersion: batch/v1
kind: Job
metadata:
  name: compact-injection-reference-v1
  namespace: martian-verify
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: benchmark
          image: 10.96.100.100:5000/martian-injection-reference:upgrade-20261017-v1
          imagePullPolicy: IfNotPresent
          args: ["--threads", "2", "--iterations", "30"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "2", memory: 4Gi}
