apiVersion: batch/v1
kind: Job
metadata:
  name: compact-model-benchmark
  namespace: martian-verify
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: benchmark
          image: 10.96.100.100:5000/martian-model-lab:upgrade-20261017-v2
          args: ["--device", "cpu", "--tokens", "256", "512", "1024", "--iterations", "30", "--threads", "2"]
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
