apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: compact-model-experiments
  namespace: martian-model-lab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: compact-model-scope-v1
  namespace: martian-model-lab
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: experiment
          image: martian-model-scope:upgrade-20261017-v1
          imagePullPolicy: Never
          args: ["--dataset", "/dataset", "--output", "/artifacts/scope-v1", "--device", "cuda", "--epochs", "2", "--threads", "2"]
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: compact-model-experiments
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
