# Composite action for customer repositories.
# Callers must check out their repo first. Pass MARTIAN_API_TOKEN (required) and
# required MARTIAN_API_URL via env on the job or this step — not as action inputs.
# This action does not upload artifacts; the caller should upload the output
# folder with if: always() so a failed local gate still leaves results.
# See docs/gate-and-ci.md.
name: Martian Red Team
description: Run Martian redteam YAML assessment and fail closed on the local gate

inputs:
  config:
    description: >
      Path to the YAML assessment config, relative to the caller workspace.
      Default matches this repository (examples/config.yaml); customer repos
      should override (for example redteam.yaml).
    required: true
    default: examples/config.yaml
  output:
    description: Directory for risk-assessment.json and related artifacts
    required: false
    default: results
  max-concurrent:
    description: >
      Override system_config.max_concurrent (CLI -c). Keep at 2 or 1
      unless the granted Backend admission limits support more.
    required: false
    default: ""
  attacks-per-vuln:
    description: Override system_config.attacks_per_vulnerability_type (CLI -a)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.10.0"
        python-version: "3.12"

    # Expressions are substituted into the script text before bash parses it,
    # so quoting cannot contain them. Every value reaches the script through
    # env and is referenced as a quoted shell variable.
    - name: Install martian-sdk
      shell: bash
      env:
        MARTIAN_REDTEAM_ACTION_PATH: ${{ github.action_path }}
      # A throwaway venv, not --system: Ubuntu 24.04's interpreter is PEP 668
      # externally managed and uv refuses to install into it.
      run: |
        set -euo pipefail
        uv venv "${RUNNER_TEMP}/martian-redteam"
        uv pip install --python "${RUNNER_TEMP}/martian-redteam" "$MARTIAN_REDTEAM_ACTION_PATH"
        echo "${RUNNER_TEMP}/martian-redteam/bin" >> "${GITHUB_PATH}"

    - name: Run assessment
      shell: bash
      env:
        MARTIAN_API_TOKEN: ${{ env.MARTIAN_API_TOKEN }}
        MARTIAN_API_URL: ${{ env.MARTIAN_API_URL }}
        MARTIAN_REDTEAM_CONFIG: ${{ inputs.config }}
        MARTIAN_REDTEAM_OUTPUT: ${{ inputs.output }}
        MARTIAN_REDTEAM_MAX_CONCURRENT: ${{ inputs.max-concurrent }}
        MARTIAN_REDTEAM_ATTACKS_PER_VULN: ${{ inputs.attacks-per-vuln }}
      run: |
        extra=()
        if [ -n "$MARTIAN_REDTEAM_MAX_CONCURRENT" ]; then
          extra+=(-c "$MARTIAN_REDTEAM_MAX_CONCURRENT")
        fi
        if [ -n "$MARTIAN_REDTEAM_ATTACKS_PER_VULN" ]; then
          extra+=(-a "$MARTIAN_REDTEAM_ATTACKS_PER_VULN")
        fi
        martian redteam run "$MARTIAN_REDTEAM_CONFIG" -o "$MARTIAN_REDTEAM_OUTPUT" "${extra[@]}"
