[project]
name = "martian-sdk"
dynamic = ["version"]
description = "Martian SDK for agent evaluations, adversarial testing, and CI gates"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Martian Security" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "tenacity>=9.1.0",
    "typer>=0.16.0",
]

[project.scripts]
martian = "martian.cli:app"
martian-redteam = "martian_redteam.cli:app"

[project.optional-dependencies]
mcp = ["mcp>=2.1.1,<3", "httpx2>=2.12,<3", "jsonschema>=4.23,<5", "referencing>=0.36,<1"]
evals = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "mlflow-skinny==3.18.0",
    "pandas>=2.2",
    "pytest>=8",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]
postgres = ["martian-sdk[evals]", "psycopg[binary]>=3.2"]

[project.urls]
Homepage = "https://martiansecurity.ai/"
Repository = "https://github.com/MorningHQ/martian-redteam"
Documentation = "https://github.com/MorningHQ/martian-redteam/tree/main/docs"
Issues = "https://github.com/MorningHQ/martian-redteam/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/martian/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/martian", "src/martian_redteam", "src/martian_evals_kit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/examples", "/docs", "/scripts", "/pyproject.toml",
    "/README.md", "/LICENSE", "/NOTICE", "/uv.lock", "/Dockerfile", "/.dockerignore",
]

# The Evals UI the wheel ships in src/martian/ui/: a build of the Evals app in MorningHQ/MartianFrontend
# (`npm run build:evals`) at `commit`. scripts/vendor_ui.py replaces the folder and writes this table;
# scripts/check_release.py refuses distributions whose UI is not this build. See docs/releasing.md.
[tool.martian.ui]
version = "0.1.0"
commit = "01cb9181e25763d09b3269d3a36230da013e00d5"
digest = "sha256:f04ad40606f21fa594d6d982c315a47e0470225f292afa9d39e2afd493e65e48"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["martian_redteam", "martian"]

[tool.coverage.run]
source = ["martian_redteam", "martian"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.2.1",
    "respx>=0.22.0",
    "ruff>=0.16.5",
    "types-pyyaml>=6.0.12",
    "types-jsonschema>=4.23",
    "jsonschema>=4.23,<5",
    "pytest-xdist>=3.8.0",
    "twine>=7.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]
