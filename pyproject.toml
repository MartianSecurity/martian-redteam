[project]
name = "martian-redteam"
version = "0.1.0"
description = "Martian Security SDK for adversarial testing of AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Martian Security" }]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "tenacity>=9.1.0",
    "typer>=0.16.0",
]

[project.scripts]
martian-redteam = "martian_redteam.cli:app"

[project.urls]
Homepage = "https://martiansecurity.ai/"
Repository = "https://github.com/MorningHQ/martian-redteam"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/martian_redteam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["martian_redteam"]

[tool.coverage.run]
source = ["martian_redteam"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.2.1",
    "respx>=0.22.0",
    "ruff>=0.16.5",
    "types-pyyaml>=6.0.12",
]
