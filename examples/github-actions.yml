# Example customer GitHub Action. Requires MARTIAN_API_KEY in repo secrets.
# GitHub-hosted runner IPs are shared; keep concurrency low.
# See docs/gate-and-ci.md and docs/security-and-data.md.
name: Red team

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-team:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.0"
      - name: Install
        run: uv sync --locked
      - name: Run assessment
        env:
          MARTIAN_API_URL: ${{ vars.MARTIAN_API_URL }}
          MARTIAN_API_KEY: ${{ secrets.MARTIAN_API_KEY }}
        run: uv run martian-redteam run examples/config.yaml -o results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: red-team-results
          path: results/
