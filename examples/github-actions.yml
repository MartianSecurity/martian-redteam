# Example customer workflow using the composite action.
# Copy into .github/workflows/ in your repository and override `config`.
# See docs/gate-and-ci.md.
#
# The local `martian redteam run` exit code is the gate (1 = fail closed).
# Do not use continue-on-error or a remote Confident AI / deepeval gate.
#
# Backend applies per-key, organisation and global admission limits. Keep
# system_config.max_concurrent at 2 or 1 unless your granted limits support more.
#
# Pin third-party actions to SHAs (already done below). Pin
# MartianSecurity/martian-redteam to a release tag or a full commit SHA; replace
# v0.1.1 below with the release you depend on. @main moves under you.
#
# For the reusable-workflow style, see examples/reusable-workflow.yml.

name: Red team

on:
  workflow_dispatch:
  # pull_request:

permissions:
  contents: read

jobs:
  red-team:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Martian redteam
        uses: MartianSecurity/martian-redteam@v0.1.1 # or a full commit SHA
        # Dogfood only, never in production:
        # uses: MartianSecurity/martian-redteam@main
        with:
          config: examples/config.yaml
          output: results
          # max-concurrent: "2"
          # attacks-per-vuln: "1"
        env:
          MARTIAN_API_TOKEN: ${{ secrets.MARTIAN_API_TOKEN }}
          MARTIAN_API_URL: ${{ vars.MARTIAN_API_URL }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: red-team-results
          path: results/
          if-no-files-found: ignore
