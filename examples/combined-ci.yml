# Copy into the customer repository. Place the delivered, reviewed SDK wheel
# and release-checksums.json in ci/vendor/ (see docs/releasing.md).
# Supply real agent dependencies in requirements.txt, tests/evals and redteam.yaml.
# Do not also run the YAML assessment from an eval test.
name: Agent evals and redteam

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: agent-evals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Verify and install the SDK and customer agent
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          wheel = Path("ci/vendor/martian_sdk-0.1.1-py3-none-any.whl")
          manifest = json.loads(Path("ci/vendor/release-checksums.json").read_text())
          if hashlib.sha256(wheel.read_bytes()).hexdigest() != manifest[wheel.name]:
              raise SystemExit("SDK artifact checksum mismatch")
          PY
          uv venv .venv
          uv pip install --python .venv \
            'ci/vendor/martian_sdk-0.1.1-py3-none-any.whl[evals]' \
            -r requirements.txt
      - name: Require evals and redteam to complete and pass
        env:
          MARTIAN_API_URL: ${{ vars.MARTIAN_API_URL }}
          MARTIAN_API_TOKEN: ${{ secrets.MARTIAN_API_TOKEN }}
          MARTIAN_AGENT_ID: ${{ vars.MARTIAN_AGENT_ID }}
          MARTIAN_EVALS_GIT_SHA: ${{ github.sha }}
          MARTIAN_EVALS_STORE_DIR: ${{ runner.temp }}/martian-local-mlflow
          # Replace/add the provider credential expected by the customer's callback.
          TARGET_MODEL_API_KEY: ${{ secrets.TARGET_MODEL_API_KEY }}
          MARTIAN_REPORT_INCLUDE_CONTENT: "0"
          MARTIAN_EVALS_REDACT_INPUTS: "1"
          MARTIAN_EVALS_REDACT_OUTPUTS: "1"
        run: >-
          .venv/bin/martian ci --evals-path tests/evals
          --redteam-config redteam.yaml --require-export --output results
      - name: Keep safe result receipts and completed probes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-check-results
          path: |
            results/ci-session.json
            results/redteam/risk-assessment.json
            results/redteam/risk-assessment.md
            results/redteam/probes.jsonl
          retention-days: 3
          if-no-files-found: error

# Configure agent-evals with reviewers/restricted refs for credential access.
# Make the customer's deployment job depend on agent-checks in this workflow,
# and deploy only its tested commit/artifact after the gate succeeds.
