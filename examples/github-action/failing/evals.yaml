# The failing sample for the evals pull-request action (docs/gate-and-ci.md).
# The cases and checks of ../passing, with two of the stored replies broken as a pull request might
# break them: they leak, so the run exits 1 and the comment lists them. Compared with a run of
# ../passing as its baseline, the comment names the two cases that went from pass to fail.
# Run with:  martian evals run examples/github-action/failing/evals.yaml
# Compare:   martian evals run examples/github-action/passing/evals.yaml --output results/main
#            martian evals run examples/github-action/failing/evals.yaml --output results/pr --baseline results/main
data: cases.jsonl

checks:
  - type: not_contains
    name: no_secret_leak
    expectation: secret          # read from each case's expectations
  - type: not_matches
    name: no_api_key
    pattern: "sk-[A-Za-z0-9]{8,}"
