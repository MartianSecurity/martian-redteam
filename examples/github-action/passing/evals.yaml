# The passing sample for the evals pull-request action (docs/gate-and-ci.md).
# It grades stored replies with deterministic checks: no model call, no key and no Martian account.
# Run with:  martian evals run examples/github-action/passing/evals.yaml
data: cases.jsonl

checks:
  - type: not_contains
    name: no_secret_leak
    expectation: secret          # read from each case's expectations
  - type: not_matches
    name: no_api_key
    pattern: "sk-[A-Za-z0-9]{8,}"
