# Run deterministic eval suites on pull requests and write job summaries.
# A push to main saves verdicts for comparison. The sample suites need no credential.
# Copy this workflow and replace its suite paths and the SDK commit SHA.
#
# The passing suite exits 0 and failing exits 1 before main has a baseline.
# See the Markdown examples in comments/ and docs/gate-and-ci.md.

name: Evals

on:
  pull_request:
  push:
    branches: [main] # keeps the baseline that pull requests are compared with

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [passing, failing]
    # Cancel superseded runs of the same suite.
    concurrency:
      group: evals-${{ github.event.pull_request.number || github.ref }}-${{ matrix.suite }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run evals
        id: evals
        uses: MartianSecurity/martian-redteam/.github/actions/evals@0000000000000000000000000000000000000000 # replace: release tag or full commit SHA
        with:
          suite: examples/github-action/${{ matrix.suite }}/evals.yaml
          output: results/${{ matrix.suite }}
          baseline-branch: main

      # results.jsonl and mlflow.db hold prompts and replies in clear text, so
      # this keeps only the counts, the JUnit report and the verdicts.
      - name: Upload results
        if: always() && steps.evals.outputs.results-written == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-${{ matrix.suite }}
          path: |
            results/${{ matrix.suite }}/summary.json
            results/${{ matrix.suite }}/junit.xml
            results/${{ matrix.suite }}/verdicts.json
            results/${{ matrix.suite }}/comparison.json
          if-no-files-found: ignore
