# Example customer workflow: scan the repository's agent files with the
# Martian Scanner on every push to a protected branch, fail the job on the
# server's gate, and show the findings in GitHub code scanning. Copy into
# .github/workflows/ in your repository. See docs/scan.md.
#
# The scan runs on Martian's servers and needs a Scanner-enabled Martian Cloud
# or Enterprise organisation. Store an organisation API key with scan:run and
# scan:read as the secret MARTIAN_API_TOKEN, and the server's origin as the
# variable MARTIAN_API_URL, ideally in an environment that only protected
# branches can use.
#
# This workflow runs on pushes, not pull requests: a customer token must not
# reach code nobody has reviewed, and pull requests from forks get no
# secrets. Pull requests are scanned through the Martian GitHub App, which
# fetches their files on Martian's side. Never use pull_request_target here.
#
# The upload step sends the server's SARIF to code scanning under one stable
# category, so a re-run on unchanged content updates the same alerts instead
# of adding new ones; the server gives each finding a fingerprint that does
# not depend on its line.
#
# Pin MartianSecurity/martian-redteam to a release tag or a full commit SHA that
# has .github/actions/scan; replace the placeholder SHA below. @main moves under
# you.

name: Agent files scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: martian-scan # holds MARTIAN_API_TOKEN; restrict it to protected branches
    permissions:
      contents: read
      security-events: write # the SARIF upload; nothing else is written
    concurrency:
      group: martian-scan-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan agent files
        id: scan
        uses: MartianSecurity/martian-redteam/.github/actions/scan@0000000000000000000000000000000000000000 # replace: release tag or full commit SHA
        env:
          MARTIAN_API_URL: ${{ vars.MARTIAN_API_URL }}
          MARTIAN_API_TOKEN: ${{ secrets.MARTIAN_API_TOKEN }}
        with:
          output: results/scan
          # The default agent paths are skills, plugins, sub-agents, hooks,
          # settings, rules files and MCP configuration. To add your agent's
          # own code, list every pattern, one per line:
          # include: |
          #   AGENTS.md
          #   **/.claude/**
          #   .mcp.json
          #   src/agent/

      # Runs when the gate failed too, so the findings reach code scanning.
      - name: Upload SARIF to code scanning
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: martian-scan

      # Both exports quote the lines each finding is about. Keep scan.json out of
      # artifacts others can download if your files hold anything private.
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: martian-scan
          path: results/scan/scan.json
          if-no-files-found: ignore
